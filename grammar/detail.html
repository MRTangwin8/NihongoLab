<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
  <meta name="theme-color" content="#4c827b">
  <title>语法详情</title>
  <script src="../assets/theme.js"></script>
  <style>
    :root{color-scheme:light;--primary:#3f7772;--primary-strong:#315f5b;--accent:#c96d58;--ink:#273633;--muted:#667773;--line:#cfdbd7;--bg:#f3f7f5;--surface:#fff;--soft:#eaf3f0;--green:#377052;--badge:#e6f2ea}
    :root[data-theme="dark"]{color-scheme:dark;--primary:#76b5ac;--primary-strong:#91c9c1;--accent:#e28a74;--ink:#e5eeeb;--muted:#a7b7b3;--line:#3a4d48;--bg:#111816;--surface:#1a2421;--soft:#23322e;--green:#9dd1af;--badge:#233c31}
    @media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--primary:#76b5ac;--primary-strong:#91c9c1;--accent:#e28a74;--ink:#e5eeeb;--muted:#a7b7b3;--line:#3a4d48;--bg:#111816;--surface:#1a2421;--soft:#23322e;--green:#9dd1af;--badge:#233c31}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei","Yu Gothic UI",sans-serif;line-height:1.75;letter-spacing:0}
    a{color:var(--primary)}
    .top{border-bottom:1px solid var(--line);background:var(--surface)}
    .top-inner{max-width:920px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{font-weight:700;color:var(--primary-strong);text-decoration:none;display:flex;align-items:center;gap:9px}
    .site-icon{display:block;width:30px;height:30px;flex:0 0 auto}
    .crumbs{display:flex;gap:16px;font-size:13px}
    .top-actions{display:flex;align-items:center;gap:14px}.theme-toggle{font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}.theme-symbol{font-size:15px;line-height:1}
    main{max-width:920px;margin:auto;padding:38px 22px 56px}
    .badge{display:inline-block;font-size:12px;font-weight:700;color:var(--green);background:var(--badge);border-radius:4px;padding:2px 8px}
    h1{font-size:32px;line-height:1.35;color:var(--primary-strong);margin:10px 0 8px}
    .meaning{font-size:18px;color:#42545e;margin-bottom:30px}
    section{padding:22px 0;border-top:1px solid var(--line)}
    h2{font-size:16px;color:var(--primary-strong);margin:0 0 9px}
    .pattern{font-size:17px;white-space:pre-wrap}
    .example-list{list-style:none;margin:0;padding:0}
    .example-item{display:grid;grid-template-columns:28px minmax(0,1fr) 36px;gap:10px;align-items:start;padding:15px 0;border-bottom:1px solid var(--line)}
    .example-item:first-child{padding-top:0}
    .example-item:last-child{padding-bottom:0;border-bottom:0}
    .example-number{font-size:12px;font-weight:700;color:var(--primary);padding-top:5px}
    .example{font-size:20px;font-weight:600;margin:0 0 4px}
    .translation{font-size:15px;color:var(--muted)}
    .status{font-size:14px;color:var(--muted);background:var(--soft);padding:11px 13px;border-left:3px solid #9bb2bf}
    .speak{width:34px;height:34px;display:inline-grid;place-items:center;font:inherit;font-size:14px;padding:0;border:1px solid var(--primary);border-radius:6px;background:var(--surface);color:var(--primary);cursor:pointer}
    .speak:hover{background:var(--soft)}
    .source{font-size:13px;color:var(--muted)}
    .related{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}
    .related a{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #e8eef1;text-decoration:none}
    .related a:hover .related-title{text-decoration:underline}
    .related-level{font-size:11px;color:var(--green)}
    .pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
    .pager a{padding:12px 0;border-top:2px solid var(--primary);text-decoration:none;font-size:13px}
    .pager a:last-child{text-align:right}
    .pager strong{display:block;font-size:15px;margin-top:2px}
    .error{padding:60px 0;text-align:center;color:var(--muted)}
    @media(max-width:640px){
      .top-inner{padding:12px 16px}
      main{padding:28px 16px 44px}
      h1{font-size:26px}
      .related{grid-template-columns:1fr}
      .pager{grid-template-columns:1fr}
      .pager a:last-child{text-align:left}
    }
    @media print{.top,.speak,.pager{display:none}main{padding:0;max-width:none}}
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="../index.html"><img class="site-icon" src="../assets/icon.svg" alt="">日语学习工具</a>
      <div class="top-actions"><nav class="crumbs" aria-label="页面导航"><a href="index.html">语法目录</a><a href="../thanks/index.html">特别鸣谢</a></nav><button id="themeToggle" class="theme-toggle" type="button" aria-label="切换配色"></button></div>
    </div>
  </header>
  <main id="content"><div class="error">正在读取语法条目</div></main>
  <script src="../data/grammar.js"></script>
  <script>
    (function () {
      'use strict';
      var data = window.JA_GRAMMAR || [];
      var id = new URLSearchParams(location.search).get('id') || '';
      var item = data.find(function (entry) { return entry.id === id; });
      var root = document.getElementById('content');
      var esc = function (value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (character) {
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character];
        });
      };
      if (!item) {
        root.innerHTML = '<div class="error">找不到这个语法条目。<br><a href="index.html">返回语法目录</a></div>';
        return;
      }

      document.title = item.title + '｜' + item.level + ' 语法';
      var sameLevel = data.filter(function (entry) { return entry.level === item.level; });
      var position = sameLevel.findIndex(function (entry) { return entry.id === item.id; });
      var previous = position > 0 ? sameLevel[position - 1] : null;
      var next = position >= 0 && position < sameLevel.length - 1 ? sameLevel[position + 1] : null;
      var related = sameLevel.filter(function (entry) { return entry.id !== item.id; })
        .sort(function (a, b) {
          function score(entry) {
            var key = item.title.replace(/[〜～\s]/g, '');
            var other = entry.title.replace(/[〜～\s]/g, '');
            var points = 0;
            for (var i = 0; i < key.length - 1; i++) if (other.indexOf(key.slice(i, i + 2)) >= 0) points++;
            return points;
          }
          return score(b) - score(a);
        }).slice(0, 8);

      var examples = Array.isArray(item.examples) ? item.examples.filter(function (example) {
        return example && example.ja && example.zh;
      }) : (item.example ? [{ ja: item.example, zh: item.translation || '' }] : []);
      var exampleBlock = examples.length ? '<section><h2>例句</h2><ol class="example-list">' + examples.map(function (example, index) {
        return '<li class="example-item"><span class="example-number">' + (index + 1) + '</span>' +
          '<div><p class="example" lang="ja">' + esc(example.ja) + '</p>' +
          '<div class="translation">' + esc(example.zh) + '</div></div>' +
          '<button class="speak" type="button" data-example-index="' + index + '" title="朗读" aria-label="朗读第' + (index + 1) + '条例句">&#9654;</button></li>';
      }).join('') + '</ol></section>' : '';
      var relatedHtml = related.map(function (entry) {
        return '<a href="detail.html?id=' + encodeURIComponent(entry.id) + '"><span class="related-title">' + esc(entry.title) +
          '</span><span class="related-level">' + esc(entry.level) + '</span></a>';
      }).join('');
      var previousHtml = previous ? '<a href="detail.html?id=' + encodeURIComponent(previous.id) + '">← 上一条<strong>' + esc(previous.title) + '</strong></a>' : '<span></span>';
      var nextHtml = next ? '<a href="detail.html?id=' + encodeURIComponent(next.id) + '">下一条 →<strong>' + esc(next.title) + '</strong></a>' : '<span></span>';

      root.innerHTML = '<span class="badge">' + esc(item.level) + '</span><h1>' + esc(item.title) + '</h1>' +
        '<div class="meaning">' + esc(item.meaning) + '</div>' +
        '<section><h2>接续</h2><div class="pattern">' + esc(item.pattern) + '</div></section>' +
        exampleBlock +
        '<section><h2>同级相关文型</h2><div class="related">' + relatedHtml + '</div></section>' +
        '<nav class="pager" aria-label="相邻语法">' + previousHtml + nextHtml + '</nav>';

      root.addEventListener('click', function (event) {
        var speak = event.target.closest('button[data-example-index]');
        if (!speak) return;
        if (!('speechSynthesis' in window)) {
          speak.disabled = true;
          speak.title = '当前浏览器不支持朗读';
          return;
        }
        window.speechSynthesis.cancel();
        var selectedExample = examples[Number(speak.dataset.exampleIndex)];
        if (!selectedExample) return;
        var utterance = new SpeechSynthesisUtterance(selectedExample.ja);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.88;
        window.speechSynthesis.speak(utterance);
      });
    })();
  </script>
</body>
</html>
