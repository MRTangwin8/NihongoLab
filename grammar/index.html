<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
  <meta name="theme-color" content="#4c827b">
  <title>日语语法目录</title>
  <script src="../assets/theme.js"></script>
  <style>
    :root{color-scheme:light;--primary:#3f7772;--primary-strong:#315f5b;--ink:#273633;--muted:#667773;--line:#cfdbd7;--bg:#f3f7f5;--surface:#fff;--soft:#eaf3f0;--green:#377052;--badge:#e6f2ea;--accent:#c96d58}
    :root[data-theme="dark"]{color-scheme:dark;--primary:#76b5ac;--primary-strong:#91c9c1;--ink:#e5eeeb;--muted:#a7b7b3;--line:#3a4d48;--bg:#111816;--surface:#1a2421;--soft:#23322e;--green:#9dd1af;--badge:#233c31;--accent:#e28a74}
    @media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--primary:#76b5ac;--primary-strong:#91c9c1;--ink:#e5eeeb;--muted:#a7b7b3;--line:#3a4d48;--bg:#111816;--surface:#1a2421;--soft:#23322e;--green:#9dd1af;--badge:#233c31;--accent:#e28a74}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei","Yu Gothic UI",sans-serif;line-height:1.65;letter-spacing:0}
    a{color:var(--primary)}
    .top{background:var(--surface);border-bottom:1px solid var(--line)}
    .top-inner{max-width:1120px;margin:auto;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .top h1{font-size:22px;margin:0;font-weight:700;color:var(--primary-strong);display:flex;align-items:center;gap:10px}
    .site-icon{display:block;width:34px;height:34px;flex:0 0 auto}
    .top-actions{display:flex;align-items:center;gap:14px}.back{color:var(--primary);font-size:13px;text-decoration:none}
    .theme-toggle{font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}.theme-symbol{font-size:15px;line-height:1}
    main{max-width:1120px;margin:auto;padding:24px 22px 48px}
    .toolbar{display:grid;grid-template-columns:minmax(230px,1fr) auto;gap:14px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .search{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--surface)}
    .search:focus{outline:2px solid color-mix(in srgb,var(--primary) 35%,transparent);outline-offset:1px;border-color:var(--primary)}
    .levels{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
    .levels button{font:inherit;font-size:13px;padding:8px 12px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;min-width:48px}
    .levels button:last-child{border-right:0}
    .levels button.on{background:var(--primary);color:#fff}
    .summary{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0 8px;font-size:13px;color:var(--muted)}
    .summary strong{color:var(--ink)}
    .list{border-top:1px solid var(--line)}
    .row{display:grid;grid-template-columns:58px minmax(180px,1.1fr) minmax(260px,1.6fr) 28px;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
    .row:hover{background:var(--soft)}
    .badge{justify-self:start;font-size:11px;font-weight:700;color:var(--green);background:var(--badge);border-radius:4px;padding:2px 7px}
    .title{font-size:16px;font-weight:700;color:var(--primary-strong)}
    .meaning{font-size:13.5px;color:var(--muted)}
    .pattern{font-size:12.5px;color:#53636c;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .arrow{font-size:19px;color:var(--accent);text-align:center}
    .empty{padding:48px 0;text-align:center;color:var(--muted)}
    .more-wrap{text-align:center;margin-top:20px}
    .more{font:inherit;font-size:13px;padding:8px 16px;border:1px solid var(--primary);border-radius:6px;background:var(--surface);color:var(--primary);cursor:pointer}
    .more:hover{background:var(--soft)}
    .hide{display:none}
    @media(max-width:760px){
      .top-inner{padding:16px}
      main{padding:18px 16px 40px}
      .toolbar{grid-template-columns:1fr}
      .levels{display:grid;grid-template-columns:repeat(4,1fr)}
      .levels button{border-bottom:1px solid var(--line)}
      .levels button:nth-child(4n){border-right:0}
      .levels button:nth-last-child(-n+3){border-bottom:0}
      .row{grid-template-columns:48px 1fr 22px;gap:9px;padding:13px 2px}
      .row-copy{grid-column:2}
      .arrow{grid-column:3;grid-row:1 / span 2}
      .meaning{margin-top:3px}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <h1><img class="site-icon" src="../assets/icon.svg" alt="">日语语法目录</h1>
      <div class="top-actions"><a class="back" href="../index.html">返回学习工具</a><a class="back" href="../thanks/index.html">特别鸣谢</a><button id="themeToggle" class="theme-toggle" type="button" aria-label="切换配色"></button></div>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="搜索文型、中文意思或接续" aria-label="搜索语法">
      <div id="levels" class="levels" aria-label="语法等级"></div>
    </div>
    <div class="summary"><span id="summary">正在读取语法数据</span><span id="shown"></span></div>
    <div id="list" class="list"></div>
    <div class="more-wrap"><button id="more" class="more hide" type="button">显示更多</button></div>
  </main>
  <script src="../data/grammar.js"></script>
  <script>
    (function () {
      'use strict';
      var levels = ['all', 'N5', 'N4', 'N3', 'N2', 'N1', 'EJU'];
      var selected = new URLSearchParams(location.search).get('level') || 'all';
      if (levels.indexOf(selected) < 0) selected = 'all';
      var query = '';
      var limit = 100;
      var data = window.JA_GRAMMAR || [];
      var $ = function (id) { return document.getElementById(id); };
      var esc = function (value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (character) {
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character];
        });
      };

      function buildTabs() {
        $('levels').innerHTML = levels.map(function (level) {
          var label = level === 'all' ? '全部' : level;
          return '<button type="button" data-level="' + level + '" class="' + (level === selected ? 'on' : '') + '">' + label + '</button>';
        }).join('');
      }

      function filtered() {
        var needle = query.trim().toLowerCase();
        return data.filter(function (item) {
          if (selected !== 'all' && item.level !== selected) return false;
          if (!needle) return true;
          return [item.title, item.meaning, item.pattern].join(' ').toLowerCase().indexOf(needle) >= 0;
        });
      }

      function render() {
        var items = filtered();
        var visible = items.slice(0, limit);
        var exampleCount = items.reduce(function (total, item) {
          return total + (Array.isArray(item.examples) ? item.examples.length : (item.example ? 1 : 0));
        }, 0);
        $('summary').innerHTML = '<strong>' + items.length + '</strong> 条匹配结果 · 例句 ' + exampleCount + ' 组 · 全库 ' + data.length + ' 条';
        $('shown').textContent = visible.length < items.length ? '已显示 ' + visible.length + ' 条' : '';
        $('list').innerHTML = visible.length ? visible.map(function (item) {
          return '<a class="row" href="detail.html?id=' + encodeURIComponent(item.id) + '">' +
            '<span class="badge">' + esc(item.level) + '</span>' +
            '<span><span class="title">' + esc(item.title) + '</span></span>' +
            '<span class="row-copy"><span class="meaning">' + esc(item.meaning) + '</span>' +
            '<span class="pattern">接续：' + esc(item.pattern) + '</span></span>' +
            '<span class="arrow" aria-hidden="true">›</span></a>';
        }).join('') : '<div class="empty">没有找到匹配的语法条目。</div>';
        $('more').classList.toggle('hide', visible.length >= items.length);
        $('more').textContent = '显示更多（还有 ' + Math.max(0, items.length - visible.length) + ' 条）';
      }

      buildTabs();
      render();
      $('levels').addEventListener('click', function (event) {
        var button = event.target.closest('button[data-level]');
        if (!button) return;
        selected = button.dataset.level;
        limit = 100;
        Array.prototype.forEach.call(this.querySelectorAll('button'), function (item) {
          item.classList.toggle('on', item === button);
        });
        render();
      });
      $('search').addEventListener('input', function () {
        query = this.value;
        limit = 100;
        render();
      });
      $('more').addEventListener('click', function () {
        limit += 100;
        render();
      });
    })();
  </script>
</body>
</html>
