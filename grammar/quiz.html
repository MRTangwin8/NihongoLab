<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
  <meta name="theme-color" content="#4c827b">
  <title>语法练习｜NihongoLab</title>
  <script src="../assets/theme.js"></script>
  <style>
    :root{color-scheme:light;--primary:#3f7772;--strong:#315f5b;--ink:#273633;--muted:#667773;--line:#cfdbd7;--bg:#f3f7f5;--surface:#fff;--soft:#eaf3f0;--ok:#28784f;--bad:#b84b3b;--okbg:#e7f5ec;--badbg:#fbecea}
    :root[data-theme="dark"]{color-scheme:dark;--primary:#76b5ac;--strong:#91c9c1;--ink:#e5eeeb;--muted:#a7b7b3;--line:#3a4d48;--bg:#111816;--surface:#1a2421;--soft:#23322e;--ok:#83c79e;--bad:#ee9588;--okbg:#20382b;--badbg:#402724}
    @media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--primary:#76b5ac;--strong:#91c9c1;--ink:#e5eeeb;--muted:#a7b7b3;--line:#3a4d48;--bg:#111816;--surface:#1a2421;--soft:#23322e;--ok:#83c79e;--bad:#ee9588;--okbg:#20382b;--badbg:#402724}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei","Yu Gothic UI",sans-serif;line-height:1.65;letter-spacing:0}
    .top{background:var(--surface);border-bottom:1px solid var(--line)}.top-inner{max-width:900px;margin:auto;padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:9px;color:var(--strong);font-size:18px;font-weight:700;text-decoration:none}.site-icon{width:32px;height:32px}.top-actions{display:flex;align-items:center;gap:12px}.top-actions a{font-size:13px;color:var(--primary);text-decoration:none}.theme-toggle{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
    main{max-width:900px;margin:auto;padding:22px 18px 54px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}.panel h1{font-size:21px;margin:0 0 15px;color:var(--strong)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:10px 0}.label{font-size:13px;color:var(--muted);min-width:42px}select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--muted);cursor:pointer}.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}.btn{font:inherit;padding:8px 16px;border:1px solid var(--primary);border-radius:6px;background:var(--primary);color:#fff;cursor:pointer}.btn.secondary{background:var(--surface);color:var(--primary)}.meta{font-size:13px;color:var(--muted)}
    .progress{height:7px;background:var(--soft);border-radius:5px;overflow:hidden;margin:8px 0 18px}.progress i{display:block;height:100%;background:var(--primary);width:0;transition:width .2s}.qhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.badges{display:flex;gap:7px;margin-bottom:10px}.badge{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--soft);color:var(--primary)}.stem{font-size:20px;font-weight:650;margin:12px 0 18px;white-space:pre-wrap}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{font:inherit;text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);cursor:pointer}.option:hover{border-color:var(--primary)}.option.selected{background:var(--soft);border-color:var(--primary)}.option.correct{background:var(--okbg);border-color:var(--ok)}.option.wrong{background:var(--badbg);border-color:var(--bad)}.feedback{display:none;margin-top:15px;padding:12px 14px;border-radius:7px}.feedback.show{display:block}.feedback.ok{background:var(--okbg);border:1px solid var(--ok)}.feedback.no{background:var(--badbg);border:1px solid var(--bad)}.explain{font-size:13.5px;color:var(--muted);margin-top:5px}.detail-link{display:inline-block;margin-top:8px;color:var(--primary);font-size:13px;font-weight:700}.actions{display:flex;gap:9px;margin-top:15px}.hide{display:none}.result{text-align:center;padding:14px}.score{font-size:42px;font-weight:750;color:var(--primary)}.breakdown{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:15px 0}.breakdown span{padding:5px 10px;background:var(--soft);border-radius:5px;font-size:13px}
    .sort-area{display:none}.sort-area.show{display:block}.sort-hint{font-size:13px;color:var(--muted);margin-bottom:8px}.sort-slots,.sort-pool{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sort-slots{margin-bottom:12px}.sort-slot{min-height:52px;border:1px dashed var(--primary);border-radius:7px;background:var(--soft);display:flex;align-items:center;justify-content:center;padding:7px;color:var(--muted)}.sort-piece{font:inherit;min-height:48px;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);cursor:grab}.sort-piece.used{visibility:hidden}.sort-slots .sort-piece{width:100%;border-color:var(--primary)}
    .grammar-picker{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px;background:var(--bg)}.grammar-picker-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}.grammar-picker input{flex:1;min-width:190px;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}.mini-btn{font:inherit;font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--primary);cursor:pointer}.grammar-list{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-height:230px;overflow:auto}.grammar-choice{display:flex;gap:7px;align-items:flex-start;padding:6px;border-radius:5px;font-size:12px;cursor:pointer}.grammar-choice:hover{background:var(--soft)}.grammar-choice input{flex:0 0 auto;min-width:0;margin-top:3px}.grammar-choice small{display:block;color:var(--muted)}
    @media(max-width:620px){.top-inner{padding:14px}.brand{font-size:15px}.top-actions a:first-child{display:none}main{padding:16px 12px 40px}.panel{padding:15px}.options{grid-template-columns:1fr}.sort-slots,.sort-pool{grid-template-columns:1fr 1fr}.stem{font-size:18px}.row{align-items:flex-start}.label{width:100%}.grammar-list{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><div class="top-inner"><a class="brand" href="../index.html"><img class="site-icon" src="../assets/icon.svg" alt="">NihongoLab - 日语学习工具</a><div class="top-actions"><a href="index.html">语法目录</a><button id="themeToggle" class="theme-toggle" type="button" aria-label="切换配色"></button></div></div></header>
  <main>
    <section id="setup" class="panel">
      <h1>语法练习</h1>
      <div class="row"><span class="label">等级</span><div id="levels" class="chips"></div></div>
      <div class="row"><span class="label">题型</span><div id="types" class="chips"></div></div>
      <div class="row"><span class="label">语法点</span><div class="grammar-picker"><div class="grammar-picker-tools"><input id="grammarFilter" type="search" placeholder="搜索语法点或中文意思"><button id="selectVisibleGrammar" class="mini-btn" type="button">全选当前结果</button><button id="clearGrammar" class="mini-btn" type="button">清空</button><button id="allGrammar" class="mini-btn" type="button">恢复全部</button></div><div id="grammarList" class="grammar-list"></div><div id="grammarMeta" class="meta"></div></div></div>
      <div class="row"><label class="label" for="count">题数</label><select id="count"><option>10</option><option selected>20</option><option>30</option><option>50</option><option value="all">全部</option></select><span id="bankMeta" class="meta"></span></div>
      <div class="row"><button id="start" class="btn" type="button">开始练习</button><button id="exportBank" class="btn secondary" type="button">导出 Word 试卷</button><button id="importBank" class="btn secondary" type="button">导入题库 JSON</button><input id="importFile" class="hide" type="file" accept="application/json,.json"><span id="importStatus" class="meta"></span></div>
    </section>
    <section id="quiz" class="panel hide">
      <div class="qhead"><span id="position"></span><span id="runningScore"></span></div><div class="progress"><i id="bar"></i></div>
      <div class="badges"><span id="qlevel" class="badge"></span><span id="qtype" class="badge"></span></div>
      <div id="stem" class="stem" lang="ja"></div><div id="options" class="options"></div><div id="sortArea" class="sort-area"><div class="sort-hint">点击下方片段依次填入，也可以拖动片段调整顺序。</div><div id="sortSlots" class="sort-slots"></div><div id="sortPool" class="sort-pool"></div></div><div id="feedback" class="feedback" aria-live="polite"></div>
      <div class="actions"><button id="submit" class="btn" type="button">提交答案</button><button id="next" class="btn secondary hide" type="button">下一题</button></div>
    </section>
    <section id="result" class="panel hide"><div class="result"><div class="meta">本次成绩</div><div id="score" class="score"></div><div id="breakdown" class="breakdown"></div><button id="again" class="btn" type="button">再练一组</button></div></section>
  </main>
  <script src="export-docx.js"></script><script src="../data/grammar.js"></script><script src="../data/grammar_quiz.js"></script><script src="../data/grammar_quiz_extra.js"></script>
  <script>
  (function(){'use strict';
    var $=function(id){return document.getElementById(id)};var levels=['N5','N4','N3','N2','N1','EJU'];var types=['句中选择','辨析','接续判断','排序','篇章衔接','意思判断','例句判断'];var selectedLevels=levels.slice();var selectedTypes=types.slice();var selectedGrammar=null;var queue=[],at=0,picked=-1,sortPicked=[],answered=false,correct=0,stats={};
    function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
    function chips(id,items,selected){$(id).innerHTML=items.map(function(x){return '<button type="button" class="chip on" data-value="'+x+'">'+x+'</button>'}).join('');$(id).addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;b.classList.toggle('on');var arr=Array.prototype.map.call(this.querySelectorAll('.chip.on'),function(n){return n.dataset.value});if(id==='levels'){selectedLevels=arr;renderGrammarPicker()}else selectedTypes=arr;updateMeta()})}
    function distract(items,item,key){var pool=shuffle(items.filter(function(x){return x.id!==item.id&&x.level===item.level}).map(function(x){return x[key]}).filter(function(x,i,a){return x&&a.indexOf(x)===i&&x!==item[key]}));return pool.slice(0,3)}
    function grammarForms(title){return String(title||'').replace(/^[〜～]+/,'').split(/[／/]/).map(function(x){return x.replace(/[（(][^）)]*[）)]/g,'').replace(/^[〜～]+/,'').trim()}).filter(function(x){return x.length>0})}
    function grammarFor(q){if(q.grammarId){var direct=(window.JA_GRAMMAR||[]).find(function(item){return item.id===q.grammarId});if(direct)return direct}var text=[q.stem,q.explanation,q.options[q.answer]].join(' '),best=null,bestLength=0;(window.JA_GRAMMAR||[]).forEach(function(item){grammarForms(item.title).forEach(function(form){if(form.length>bestLength&&text.indexOf(form)>=0&&(item.level===q.level||q.level==='EJU')){best=item;bestLength=form.length}})});return best}
    function exampleMatch(item){var examples=Array.isArray(item.examples)?item.examples:[];var forms=grammarForms(item.title).sort(function(a,b){return b.length-a.length});for(var i=0;i<examples.length;i++){for(var j=0;j<forms.length;j++){if(examples[i].ja&&examples[i].ja.indexOf(forms[j])>=0)return {example:examples[i],form:forms[j]}}}return null}
    function formDistractors(data,item,correct){var values=[];shuffle(data.filter(function(x){return x.id!==item.id&&x.level===item.level})).forEach(function(x){grammarForms(x.title).forEach(function(f){if(f!==correct&&values.indexOf(f)<0&&f.length<18)values.push(f)})});return values.slice(0,3)}
    function automatic(){var data=window.JA_GRAMMAR||[],out=[];data.forEach(function(item){var hit=exampleMatch(item);var mo=distract(data,item,'meaning');if(item.meaning&&mo.length===3){var opts=shuffle([item.meaning].concat(mo));var context=hit?'例句：'+hit.example.ja+'\n句中的「'+hit.form+'」':'「'+item.title+'」';out.push({id:item.id+'-meaning',level:item.level,type:'意思判断',stem:context+'表达的意思最接近哪一项？',options:opts,answer:opts.indexOf(item.meaning),explanation:item.title+'：'+item.meaning+'。'+(hit&&hit.example.zh?'例句译文：'+hit.example.zh:'')})}if(hit){var fd=formDistractors(data,item,hit.form);if(fd.length===3){var opts2=shuffle([hit.form].concat(fd));out.push({id:item.id+'-pattern',level:item.level,type:'接续判断',stem:hit.example.ja.replace(hit.form,'（　）'),options:opts2,answer:opts2.indexOf(hit.form),explanation:'括号中应填「'+hit.form+'」。'+item.title+'：'+item.meaning+'；接续：'+item.pattern})}}});return out}
    var IMPORT_KEY='nihongolab.grammarQuiz.imported.v1',imported=[];try{imported=JSON.parse(localStorage.getItem(IMPORT_KEY)||'[]');if(!Array.isArray(imported))imported=[]}catch(e){imported=[]}
    var bank=(window.JA_GRAMMAR_QUIZ||[]).concat(window.JA_GRAMMAR_QUIZ_EXTRA||[],imported);
    function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function visibleGrammar(){var query=$('grammarFilter').value.trim().toLowerCase();return (window.JA_GRAMMAR||[]).filter(function(item){return selectedLevels.indexOf(item.level)>=0&&(!query||[item.title,item.meaning,item.pattern].join(' ').toLowerCase().indexOf(query)>=0)})}
    function renderGrammarPicker(){var items=visibleGrammar();$('grammarList').innerHTML=items.map(function(item){var checked=selectedGrammar===null||selectedGrammar[item.id];return '<label class="grammar-choice"><input type="checkbox" data-id="'+esc(item.id)+'" '+(checked?'checked':'')+'><span><b>'+esc(item.title)+'</b><small>'+esc(item.level+' · '+item.meaning)+'</small></span></label>'}).join('');var total=(window.JA_GRAMMAR||[]).filter(function(item){return selectedLevels.indexOf(item.level)>=0}).length,chosen=selectedGrammar===null?total:Object.keys(selectedGrammar).filter(function(id){return selectedGrammar[id]&&(window.JA_GRAMMAR||[]).some(function(item){return item.id===id&&selectedLevels.indexOf(item.level)>=0})}).length;$('grammarMeta').textContent=(selectedGrammar===null?'当前等级全部 '+total+' 个语法点':'已选 '+chosen+' / '+total+' 个语法点')+(items.length!==total?' · 当前显示 '+items.length+' 个':'');updateMeta()}
    $('grammarFilter').addEventListener('input',renderGrammarPicker);
    $('grammarList').addEventListener('change',function(e){if(!e.target.dataset.id)return;if(selectedGrammar===null){selectedGrammar={};(window.JA_GRAMMAR||[]).forEach(function(item){selectedGrammar[item.id]=true})}selectedGrammar[e.target.dataset.id]=e.target.checked;renderGrammarPicker()});
    $('selectVisibleGrammar').addEventListener('click',function(){if(selectedGrammar===null)selectedGrammar={};visibleGrammar().forEach(function(item){selectedGrammar[item.id]=true});renderGrammarPicker()});
    $('clearGrammar').addEventListener('click',function(){selectedGrammar={};renderGrammarPicker()});
    $('allGrammar').addEventListener('click',function(){selectedGrammar=null;renderGrammarPicker()});
    function validQuestion(q){return q&&typeof q.id==='string'&&levels.indexOf(q.level)>=0&&typeof q.type==='string'&&typeof q.stem==='string'&&Array.isArray(q.options)&&q.options.length>=2&&q.options.every(function(x){return typeof x==='string'})&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length&&typeof q.explanation==='string'&&(q.type!=='排序'||Array.isArray(q.order)&&q.order.length===q.options.length)}
    function wantedCount(length){return $('count').value==='all'?length:Math.min(Number($('count').value),length)}
    $('exportBank').addEventListener('click',function(){if(!selectedLevels.length||!selectedTypes.length){alert('请至少选择一个等级和一种题型。');return}var available=filtered();if(!available.length){alert('当前筛选条件下没有可导出的题目。');return}var paper=shuffle(available).slice(0,wantedCount(available.length)).map(randomized);window.GrammarDocx.exportPaper(paper,selectedLevels)});
    $('importBank').addEventListener('click',function(){$('importFile').click()});
    $('importFile').addEventListener('change',function(){var file=this.files&&this.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var data=JSON.parse(reader.result),items=Array.isArray(data)?data:(data&&data.questions);if(!Array.isArray(items))throw new Error('JSON 顶层应为题目数组或包含 questions 数组。');var invalid=items.filter(function(q){return !validQuestion(q)});if(invalid.length)throw new Error('有 '+invalid.length+' 题字段或答案索引不合格。');var ids={};bank.forEach(function(q){ids[q.id]=1});var added=items.filter(function(q){return !ids[q.id]});imported=imported.concat(added);localStorage.setItem(IMPORT_KEY,JSON.stringify(imported));bank=bank.concat(added);$('importStatus').textContent='已导入 '+added.length+' 题，跳过 '+(items.length-added.length)+' 个重复 ID。';updateMeta()}catch(e){$('importStatus').textContent='导入失败：'+e.message}};reader.readAsText(file,'utf-8');this.value=''});
    function filtered(){return bank.filter(function(q){if(selectedLevels.indexOf(q.level)<0||selectedTypes.indexOf(q.type)<0)return false;if(selectedGrammar===null)return true;var grammar=grammarFor(q);return !!(grammar&&selectedGrammar[grammar.id])})}
    function randomized(q){var pairs=q.options.map(function(text,index){return {text:text,original:index,correct:index===q.answer}});pairs=shuffle(pairs);var copy={};Object.keys(q).forEach(function(key){copy[key]=q[key]});copy.options=pairs.map(function(x){return x.text});copy.answer=pairs.findIndex(function(x){return x.correct});if(q.order)copy.order=q.order.map(function(original){return pairs.findIndex(function(x){return x.original===original})});return copy}
    function updateMeta(){$('bankMeta').textContent='当前可抽取 '+filtered().length+' 题'}
    function render(){var q=queue[at];picked=-1;sortPicked=[];answered=false;$('position').textContent='第 '+(at+1)+' / '+queue.length+' 题';$('runningScore').textContent='正确 '+correct;$('bar').style.width=(at/queue.length*100)+'%';$('qlevel').textContent=q.level;$('qtype').textContent=q.type;$('stem').textContent=q.stem;$('feedback').className='feedback';$('feedback').innerHTML='';$('submit').classList.remove('hide');$('next').classList.add('hide');var sorting=q.type==='排序';$('options').classList.toggle('hide',sorting);$('sortArea').classList.toggle('show',sorting);if(sorting)renderSort();else $('options').innerHTML=q.options.map(function(o,i){return '<button type="button" class="option" data-index="'+i+'"><b>'+(i+1)+'.</b> '+o+'</button>'}).join('')}
    function renderSort(){var q=queue[at];$('sortSlots').innerHTML=[0,1,2,3].map(function(_,i){var idx=sortPicked[i];return '<div class="sort-slot" data-slot="'+i+'">'+(idx==null?'<span>'+(i+1)+'</span>':'<button type="button" draggable="true" class="sort-piece" data-index="'+idx+'">'+q.options[idx]+'</button>')+'</div>'}).join('');$('sortPool').innerHTML=q.options.map(function(o,i){return '<button type="button" draggable="true" class="sort-piece '+(sortPicked.indexOf(i)>=0?'used':'')+'" data-index="'+i+'">'+o+'</button>'}).join('')}
    function putSort(index,slot){if(answered)return;var old=sortPicked.indexOf(index);if(old>=0)sortPicked.splice(old,1);if(slot==null||slot>sortPicked.length)sortPicked.push(index);else sortPicked.splice(slot,0,index);if(sortPicked.length>4)sortPicked.length=4;renderSort()}
    function start(){if(!selectedLevels.length){alert('请至少选择一个等级。');return}if(!selectedTypes.length){alert('请至少选择一种题型。');return}var available=filtered();if(!available.length){alert('当前筛选条件下没有可用题目。');return}queue=shuffle(available).slice(0,wantedCount(available.length)).map(randomized);at=0;correct=0;stats={};$('result').classList.add('hide');$('quiz').classList.remove('hide');render();$('quiz').scrollIntoView({behavior:'smooth',block:'start'})}
    $('options').addEventListener('click',function(e){if(answered)return;var b=e.target.closest('.option');if(!b)return;picked=Number(b.dataset.index);Array.prototype.forEach.call(this.children,function(x){x.classList.toggle('selected',x===b)})});
    $('sortPool').addEventListener('click',function(e){var b=e.target.closest('.sort-piece');if(b)putSort(Number(b.dataset.index))});
    $('sortSlots').addEventListener('click',function(e){var b=e.target.closest('.sort-piece');if(!b||answered)return;var idx=Number(b.dataset.index),pos=sortPicked.indexOf(idx);if(pos>=0)sortPicked.splice(pos,1);renderSort()});
    document.addEventListener('dragstart',function(e){var b=e.target.closest&&e.target.closest('.sort-piece');if(b)e.dataTransfer.setData('text/plain',b.dataset.index)});$('sortSlots').addEventListener('dragover',function(e){e.preventDefault()});$('sortSlots').addEventListener('drop',function(e){e.preventDefault();var slot=e.target.closest('.sort-slot');putSort(Number(e.dataTransfer.getData('text/plain')),slot?Number(slot.dataset.slot):null)});
    $('submit').addEventListener('click',function(){if(answered)return;var q=queue[at],sorting=q.type==='排序';if(sorting&&sortPicked.length<4){alert('请把四个片段全部排入上方空位。');return}if(!sorting&&picked<0){alert('请先选择一个答案。');return}answered=true;var ok=sorting?q.order.every(function(x,i){return sortPicked[i]===x}):picked===q.answer;if(ok)correct++;stats[q.type]=stats[q.type]||[0,0];stats[q.type][1]++;if(ok)stats[q.type][0]++;if(!sorting)Array.prototype.forEach.call($('options').children,function(b,i){b.classList.remove('selected');if(i===q.answer)b.classList.add('correct');else if(i===picked)b.classList.add('wrong')});var grammar=grammarFor(q),link=grammar?'<a class="detail-link" href="detail.html?id='+encodeURIComponent(grammar.id)+'">查看「'+grammar.title+'」语法页 →</a>':'';$('feedback').className='feedback show '+(ok?'ok':'no');$('feedback').innerHTML='<b>'+(ok?'回答正确':'回答错误')+'</b><div class="explain">'+q.explanation+'</div>'+link;$('submit').classList.add('hide');$('next').classList.remove('hide');$('next').textContent=at+1===queue.length?'查看成绩':'下一题'});
