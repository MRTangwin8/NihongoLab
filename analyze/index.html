<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>句子分析｜NihongoLab</title><script src="../assets/theme.js"></script>
<style>:root{--p:#3f7772;--ink:#273633;--muted:#667773;--line:#cfdbd7;--bg:#f3f7f5;--surface:#fff;--soft:#eaf3f0;--noun:#dcefe8;--verb:#ffe0d5;--particle:#e1e6f4;--modifier:#fff0bd;--aux:#eadff3}:root[data-theme=dark]{color-scheme:dark;--p:#76b5ac;--ink:#e5eeeb;--muted:#a7b7b3;--line:#3a4d48;--bg:#111816;--surface:#1a2421;--soft:#23322e;--noun:#21493f;--verb:#59352d;--particle:#303b57;--modifier:#56491f;--aux:#493759}@media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--p:#76b5ac;--ink:#e5eeeb;--muted:#a7b7b3;--line:#3a4d48;--bg:#111816;--surface:#1a2421;--soft:#23322e;--noun:#21493f;--verb:#59352d;--particle:#303b57;--modifier:#56491f;--aux:#493759}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","Yu Gothic UI",sans-serif;line-height:1.7}main{max-width:980px;margin:auto;padding:28px 18px}a{color:var(--p)}textarea{width:100%;min-height:120px;padding:12px;font:inherit;font-size:17px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:7px}button{margin-top:10px;padding:9px 20px;border:0;border-radius:6px;background:var(--p);color:#fff;font:inherit;cursor:pointer}.ruby-line{font-size:25px;padding:20px 0}.ruby-line ruby{margin-right:3px}rt{font-size:11px;color:var(--muted)}.status,.hint{color:var(--muted);font-size:13px}.status{margin-left:10px}.diagram{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:16px;margin-bottom:16px}.tokens{display:flex;gap:7px;flex-wrap:wrap}.token{border-radius:5px;padding:7px 10px;min-width:48px;text-align:center}.token small{display:block;color:var(--muted);font-size:11px}.noun{background:var(--noun)}.verb{background:var(--verb)}.particle{background:var(--particle)}.modifier{background:var(--modifier)}.aux{background:var(--aux)}.relations{margin-top:14px;display:grid;gap:7px}.relation{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.arrow{color:var(--p);font-weight:700;font-size:20px}.translation{margin:16px 0;padding:12px 15px;border-left:4px solid var(--p);background:var(--soft);border-radius:0 6px 6px 0}.translation b{display:block;color:var(--p);font-size:12px}.wrap{overflow:auto;border:1px solid var(--line);border-radius:7px}table{width:100%;border-collapse:collapse;background:var(--surface);min-width:780px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}th{background:var(--soft);color:var(--p)}</style>
</head><body><main><a href="../index.html">返回首页</a><h1>句子成分分析</h1><textarea id="text" lang="ja" placeholder="输入日语句子，例如：図書館で借りた本を電車の中で読みました。"></textarea><label style="display:block;margin:8px 0"><input type="checkbox" id="onlineTranslation"> 在线中文翻译（MyMemory）</label><button id="go">开始分析</button><button id="retry" type="button" hidden>重新加载词典</button><span role="status" class="status" id="status">正在加载分析词典…</span><div class="ruby-line" id="ruby"></div><div id="diagram"></div><div id="translation"></div><div class="wrap" id="out"></div><p class="hint">分词、注音和活用分析在本机完成，无需联网。颜色、修饰关系和翻译用于辅助理解，复杂省略或倒装句仍需结合上下文判断。</p></main><script src="guard.js?v=20260919-verbforms"></script>
<script>(function(){var $=function(x){return document.getElementById(x)};function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function hira(s){return String(s||'').replace(/[ァ-ヶ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-96)})}function role(t){if(t.pos==='助詞'){if(t.pos_detail_1==='接続助詞'&&/^(て|で)$/.test(t.surface_form))return 'て形接续／连接后续表达';if(/は|も/.test(t.surface_form))return'主题';if(t.surface_form==='が')return'主语标记';if(t.surface_form==='を')return'宾语标记';if(/に|へ/.test(t.surface_form))return'对象／方向';if(t.surface_form==='で')return'场所／手段';return'助词'}if(t.pos==='動詞')return'谓语／动词修饰';if(t.pos==='形容詞')return'修饰语／谓语';if(t.pos==='副詞'||t.pos==='連体詞')return'修饰语';if(t.pos==='名詞')return'名词成分';if(t.pos==='助動詞')return'助动成分';return t.pos||'其他'}function cls(t){if(t.pos==='名詞')return'noun';if(t.pos==='動詞')return'verb';if(t.pos==='助詞')return'particle';if(t.pos==='助動詞')return'aux';if(/形容詞|副詞|連体詞/.test(t.pos))return'modifier';return''}function ruby(t){var s=esc(t.surface_form),r=hira(t.reading);return /[一-龯々]/.test(t.surface_form)&&r?'<ruby><rb>'+s+'</rb><rt>'+esc(r)+'</rt></ruby>':s}function inflection(ts,i){var t=ts[i],parts=[t.surface_form],labels=[],j=i+1;while(j<ts.length&&ts[j].pos==='助動詞'){parts.push(ts[j].surface_form);if(ts[j].basic_form==='た')labels.push('过去式');if(ts[j].basic_form==='ない')labels.push('否定');if(ts[j].basic_form==='ます')labels.push('礼貌体');j++}var form=t.conjugated_form&&t.conjugated_form!=='*'?t.conjugated_form:'';if(form)labels.push(form);return{surface:parts.join(''),label:labels.filter(function(x,i,a){return a.indexOf(x)===i}).join('、')||'基本形',end:j}}function diagram(ts){var rel=[];for(var i=0;i<ts.length;i++){if(ts[i].pos==='動詞'||ts[i].pos==='形容詞'){var f=inflection(ts,i),target=-1;for(var j=f.end;j<Math.min(ts.length,f.end+4);j++){if(ts[j].pos==='名詞'){target=j;break}if(ts[j].pos==='助詞'||ts[j].pos==='記号')break}if(target>=0)rel.push('<div class="relation"><span class="token verb">'+esc(f.surface)+'<small>'+esc(ts[i].basic_form)+' · '+esc(f.label)+'</small></span><span class="arrow">→</span><span class="token noun">'+ruby(ts[target])+'<small>连体修饰</small></span></div>')}}var tokens=ts.map(function(t,i){var f=t.pos==='動詞'?inflection(ts,i).label:role(t);return'<span class="token '+cls(t)+'">'+ruby(t)+'<small>'+esc(f)+'</small></span>'}).join('');return'<div class="diagram"><div class="tokens">'+tokens+'</div>'+(rel.length?'<div class="relations">'+rel.join('')+'</div>':'')+'</div>'}async function translate(text){$('translation').innerHTML='<div class="translation"><b>中文翻译</b>正在翻译…</div>';try{var r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=ja|zh-CN'),d=await r.json(),v=d.responseData&&d.responseData.translatedText;if(!v)throw Error();$('translation').innerHTML='<div class="translation"><b>中文翻译 · MyMemory</b>'+esc(v)+'</div>'}catch(e){$('translation').innerHTML='<div class="translation"><b>中文翻译</b>翻译服务暂时无法连接。</div>'}}function renderAnalysis(text,ts){$('ruby').innerHTML=ts.map(ruby).join('');$('diagram').innerHTML=diagram(ts);$('out').innerHTML=ts.length?'<table><thead><tr><th>词语</th><th>读音</th><th>原形</th><th>词性</th><th>活用</th><th>句中作用</th></tr></thead><tbody>'+ts.map(function(t,i){var form=t.pos==='動詞'?inflection(ts,i).label:(t.conjugated_form&&t.conjugated_form!=='*'?t.conjugated_form:'—');return'<tr><td>'+ruby(t)+'</td><td>'+esc(hira(t.reading))+'</td><td>'+esc(t.basic_form)+'</td><td>'+esc([t.pos,t.pos_detail_1].filter(Boolean).join('・'))+'</td><td>'+esc(form)+'</td><td>'+esc(role(t))+'</td></tr>'}).join('')+'</tbody></table>':'';if(text&&$('onlineTranslation').checked)translate(text);else $('translation').innerHTML=''}window.renderAnalysis=renderAnalysis; })();</script><script src="worker-client.js?v=20260919-localdict"></script></body></html>
