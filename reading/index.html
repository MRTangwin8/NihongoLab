<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
  <meta name="theme-color" content="#4c827b">
  <title>日语阅读练习</title>
  <script src="../assets/theme.js"></script>
  <style>
    :root{color-scheme:light;--primary:#3f7772;--primary-strong:#315f5b;--accent:#c96d58;--ink:#273633;--muted:#667773;--line:#cfdbd7;--bg:#f3f7f5;--surface:#fff;--soft:#eaf3f0;--badge:#e6f2ea;--badge-ink:#377052;--shadow:0 8px 24px rgba(33,69,62,.07)}
    :root[data-theme="dark"]{color-scheme:dark;--primary:#76b5ac;--primary-strong:#91c9c1;--accent:#e28a74;--ink:#e5eeeb;--muted:#a7b7b3;--line:#3a4d48;--bg:#111816;--surface:#1a2421;--soft:#23322e;--badge:#233c31;--badge-ink:#9dd1af;--shadow:none}
    @media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--primary:#76b5ac;--primary-strong:#91c9c1;--accent:#e28a74;--ink:#e5eeeb;--muted:#a7b7b3;--line:#3a4d48;--bg:#111816;--surface:#1a2421;--soft:#23322e;--badge:#233c31;--badge-ink:#9dd1af;--shadow:none}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei","Yu Gothic UI",sans-serif;line-height:1.65;letter-spacing:0}a{color:var(--primary)}
    .top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top-inner{max-width:1080px;margin:auto;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:700;text-decoration:none}.site-icon{width:32px;height:32px}.top-actions{display:flex;align-items:center;gap:14px}.back{font-size:13px;text-decoration:none}.theme-toggle{font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}.theme-symbol{font-size:15px;line-height:1}
    main{max-width:1080px;margin:auto;padding:28px 20px 56px}.intro{padding:0 0 22px;border-bottom:1px solid var(--line)}h1{font-size:27px;line-height:1.35;margin:0 0 7px;color:var(--primary-strong)}.intro p{margin:0;color:var(--muted);font-size:14px}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:14px;align-items:center;margin:20px 0 12px}.search{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}.search:focus{outline:2px solid color-mix(in srgb,var(--primary) 36%,transparent);border-color:var(--primary)}.levels{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}.levels button{font:inherit;font-size:12.5px;min-width:46px;padding:8px 10px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}.levels button:last-child{border:0}.levels button.on{background:var(--primary);color:#fff}.summary{font-size:13px;color:var(--muted);margin-bottom:7px}
    .list{border-top:1px solid var(--line)}.reading-row{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:16px;align-items:start;padding:17px 8px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}.reading-row:hover{background:var(--soft)}.level{justify-self:start;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--badge);color:var(--badge-ink)}.reading-row h2{font-size:17px;line-height:1.4;margin:0 0 4px;color:var(--primary-strong)}.excerpt{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.row-meta{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px}.arrow{color:var(--accent);font-size:18px;margin-left:7px}.empty{text-align:center;color:var(--muted);padding:50px 0}
    .mode-tabs{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:16px}.mode-tabs button{font:inherit;padding:7px 16px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}.mode-tabs button:last-child{border:0}.mode-tabs button.on{background:var(--primary);color:#fff}
    @media(max-width:700px){.top-inner{padding:11px 15px}.back{display:none}.top-actions{gap:8px}main{padding:22px 15px 44px}.toolbar{grid-template-columns:1fr}.levels{display:grid;grid-template-columns:repeat(4,1fr)}.levels button{border-bottom:1px solid var(--line)}.levels button:nth-child(4n){border-right:0}.levels button:nth-last-child(-n+3){border-bottom:0}.reading-row{grid-template-columns:48px minmax(0,1fr);gap:10px}.row-meta{grid-column:2}.arrow{display:none}}
  </style>
</head>
<body>
  <header class="top"><div class="top-inner">
    <a class="brand" href="../index.html"><img class="site-icon" src="../assets/icon.svg" alt="">NihongoLab - 日语学习工具</a>
    <div class="top-actions"><a class="back" href="../index.html">返回主页</a><a class="back" href="../thanks/index.html">特别鸣谢</a><button id="themeToggle" class="theme-toggle" type="button" aria-label="切换配色"></button></div>
  </div></header>
  <main>
    <section class="intro"><h1 id="pageTitle">日语阅读练习</h1><p id="introText"></p><div id="modes" class="mode-tabs"><button type="button" data-mode="reading">阅读</button><button type="button" data-mode="listening">听力</button></div></section>
    <div class="toolbar"><input id="search" class="search" type="search" placeholder="搜索标题或正文" aria-label="搜索阅读文章"><div id="levels" class="levels" aria-label="阅读等级"></div></div>
    <div id="summary" class="summary"></div><div id="list" class="list"></div>
  </main>
  <script src="../data/reading.js"></script>
  <script>
    (function(){'use strict';
      var all=window.JA_READING||[],levels=['all','N5','N4','N3','N2','N1','EJU'];
      var params=new URLSearchParams(location.search),selected=params.get('level')||'all',mode=params.get('mode')==='listening'?'listening':'reading',query='';
      if(levels.indexOf(selected)<0)selected='all';
      var $=function(id){return document.getElementById(id)};
      var esc=function(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
      $('levels').innerHTML=levels.map(function(level){return '<button type="button" data-level="'+level+'" class="'+(level===selected?'on':'')+'">'+(level==='all'?'全部':level)+'</button>'}).join('');
      function render(){Array.prototype.forEach.call($('modes').querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.mode===mode)});$('pageTitle').textContent=mode==='listening'?'日语听力练习':'日语阅读练习';$('introText').textContent='共 '+all.length+' 篇，按 N5 至 N1、EJU 分类。答案在作答后显示。';var needle=query.trim().toLowerCase();var items=all.filter(function(x){return(selected==='all'||x.level===selected)&&(!needle||[x.title,x.body].join(' ').toLowerCase().indexOf(needle)>=0)});$('summary').textContent='共 '+items.length+' 篇，'+items.reduce(function(n,x){return n+(x.questions||[]).length},0)+' 道题';$('list').innerHTML=items.length?items.map(function(x){var excerpt=mode==='listening'?'播放音频后完成问题':(x.body.length>105?x.body.slice(0,105)+'…':x.body),levelItems=all.filter(function(y){return y.level===x.level}),order=levelItems.findIndex(function(y){return y.id===x.id})+1;return '<a class="reading-row" href="detail.html?id='+encodeURIComponent(x.id)+'&mode='+mode+'"><span class="level">'+esc(x.level)+'</span><span><h2>'+esc(x.title)+'</h2><span class="excerpt" lang="ja">'+esc(excerpt)+'</span></span><span class="row-meta">'+order+' / '+levelItems.length+' · '+(x.questions||[]).length+' 题 <span class="arrow">›</span></span></a>'}).join(''):'<div class="empty">没有找到匹配的文章。</div>'}
      $('modes').addEventListener('click',function(e){var b=e.target.closest('button[data-mode]');if(!b)return;mode=b.dataset.mode;render()});
      $('levels').addEventListener('click',function(e){var b=e.target.closest('button[data-level]');if(!b)return;selected=b.dataset.level;Array.prototype.forEach.call(this.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b)});render()});
      $('search').addEventListener('input',function(){query=this.value;render()});render();
    })();
  </script>
</body>
</html>
