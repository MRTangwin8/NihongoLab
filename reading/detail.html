<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
  <meta name="theme-color" content="#4c827b">
  <title>阅读练习</title>
  <script src="../assets/theme.js"></script>
  <style>
    :root{color-scheme:light;--primary:#3f7772;--primary-strong:#315f5b;--accent:#c96d58;--ink:#273633;--muted:#667773;--line:#cfdbd7;--bg:#f3f7f5;--surface:#fff;--soft:#eaf3f0;--ok:#2f7954;--ok-bg:#e8f5ed;--bad:#b84b3b;--bad-bg:#fbecea;--focus:#9ac6bf}
    :root[data-theme="dark"]{color-scheme:dark;--primary:#76b5ac;--primary-strong:#91c9c1;--accent:#e28a74;--ink:#e5eeeb;--muted:#a7b7b3;--line:#3a4d48;--bg:#111816;--surface:#1a2421;--soft:#23322e;--ok:#8bcaa5;--ok-bg:#20382b;--bad:#ee9b8e;--bad-bg:#402724;--focus:#477e76}
    @media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--primary:#76b5ac;--primary-strong:#91c9c1;--accent:#e28a74;--ink:#e5eeeb;--muted:#a7b7b3;--line:#3a4d48;--bg:#111816;--surface:#1a2421;--soft:#23322e;--ok:#8bcaa5;--ok-bg:#20382b;--bad:#ee9b8e;--bad-bg:#402724;--focus:#477e76}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei","Yu Gothic UI",sans-serif;line-height:1.75;letter-spacing:0}a{color:var(--primary)}
    .top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top-inner{max-width:880px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:700;text-decoration:none}.site-icon{width:30px;height:30px}.top-actions{display:flex;align-items:center;gap:14px;font-size:13px}.theme-toggle{font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}.theme-symbol{font-size:15px;line-height:1}
    main{max-width:880px;margin:auto;padding:34px 20px 60px}.level{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--soft);color:var(--primary-strong)}h1{font-size:30px;line-height:1.35;margin:9px 0 4px;color:var(--primary-strong)}.meta{font-size:12.5px;color:var(--muted);margin-bottom:24px}.article{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;font-size:19px;line-height:2.05;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);padding:22px 24px;margin-bottom:14px}.article-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:27px}.btn{font:inherit;font-size:13px;padding:8px 14px;border:1px solid var(--primary);border-radius:6px;background:var(--primary);color:#fff;cursor:pointer}.btn:hover{background:var(--primary-strong)}.btn.secondary{background:var(--surface);color:var(--primary-strong)}.btn.secondary:hover{background:var(--soft)}.btn:disabled{opacity:.55;cursor:default}
    .translation{border:1px solid var(--line);background:var(--surface);margin-bottom:28px}.translation summary{cursor:pointer;color:var(--primary-strong);font-weight:600;padding:10px 13px}.translation p{margin:0;padding:0 13px 13px;color:var(--muted);font-size:14px}.section-title{font-size:18px;margin:30px 0 12px;color:var(--primary-strong)}.question{border-top:1px solid var(--line);padding:20px 0}.question legend{font-weight:700;padding:0 0 10px;line-height:1.55}.choice{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;margin:7px 0;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}.choice:hover{border-color:var(--primary)}.choice input{margin-top:6px;accent-color:var(--primary)}.choice.correct{border-color:var(--ok);background:var(--ok-bg)}.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}.feedback{display:none;margin-top:10px;padding:10px 12px;border-left:3px solid var(--primary);background:var(--soft);font-size:13.5px;color:var(--muted)}.feedback.show{display:block}.feedback strong{color:var(--ink)}.quiz-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.quiz-note{font-size:13px;color:var(--muted)}.result{font-weight:700;color:var(--primary-strong)}.source{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:34px;padding-top:14px}.pager{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}.pager a{border-top:2px solid var(--primary);padding-top:10px;text-decoration:none;font-size:13px}.pager a:last-child{text-align:right}.pager strong{display:block;color:var(--ink);margin-top:2px}.error{text-align:center;color:var(--muted);padding:70px 0}
    @media(max-width:640px){.top-inner{padding:10px 14px}.top-actions>a{display:none}main{padding:25px 14px 46px}h1{font-size:25px}.article{font-size:18px;padding:17px 16px}.pager{grid-template-columns:1fr}.pager a:last-child{text-align:left}}
    @media print{.top,.article-actions,.translation,.quiz-actions,.pager{display:none}body{background:#fff;color:#000}main{max-width:none;padding:0}.article{border:0;padding:0}}
  </style>
</head>
<body>
  <header class="top"><div class="top-inner"><a class="brand" href="../index.html"><img class="site-icon" src="../assets/icon.svg" alt="">NihongoLab - 日语学习工具</a><div class="top-actions"><a href="index.html">阅读目录</a><a href="../thanks/index.html">特别鸣谢</a><button id="themeToggle" class="theme-toggle" type="button" aria-label="切换配色"></button></div></div></header>
  <main id="content"><div class="error">正在读取文章</div></main>
  <script src="../data/reading.js"></script>
  <script>
    (function(){'use strict';
      var data=window.JA_READING||[],id=new URLSearchParams(location.search).get('id')||'',item=data.find(function(x){return x.id===id}),root=document.getElementById('content');
      var esc=function(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
      if(!item){root.innerHTML='<div class="error">找不到这篇文章。<br><a href="index.html">返回阅读目录</a></div>';return}
      document.title=item.title+'｜'+item.level+' 阅读';
      var sameLevel=data.filter(function(x){return x.level===item.level}),pos=sameLevel.findIndex(function(x){return x.id===item.id}),prev=pos>0?sameLevel[pos-1]:null,next=pos<sameLevel.length-1?sameLevel[pos+1]:null;
      var questions=(item.questions||[]).map(function(q,qi){return '<fieldset class="question" data-question="'+qi+'"><legend>'+(qi+1)+'. '+esc(q.q)+'</legend>'+q.options.map(function(o,oi){return '<label class="choice"><input type="radio" name="q'+qi+'" value="'+oi+'"><span>'+esc(o)+'</span></label>'}).join('')+'<div class="feedback" id="feedback'+qi+'"></div></fieldset>'}).join('');
      var prevHtml=prev?'<a href="detail.html?id='+encodeURIComponent(prev.id)+'">← 上一篇<strong>'+esc(prev.title)+'</strong></a>':'<span></span>';
      var nextHtml=next?'<a href="detail.html?id='+encodeURIComponent(next.id)+'">下一篇 →<strong>'+esc(next.title)+'</strong></a>':'<span></span>';
      root.innerHTML='<span class="level">'+esc(item.level)+'</span><h1>'+esc(item.title)+'</h1><div class="meta">本级第 '+(pos+1)+' / '+sameLevel.length+' 篇 · 约 '+Math.max(1,Math.ceil(item.body.length/220))+' 分钟 · '+(item.questions||[]).length+' 道题</div><article class="article" lang="ja">'+esc(item.body)+'</article><div class="article-actions"><button id="speak" class="btn secondary" type="button">朗读全文</button></div><details class="translation"><summary>查看中文译文</summary><p>'+esc(item.translation)+'</p></details><h2 class="section-title">阅读问题</h2><form id="quiz">'+questions+'<div class="quiz-actions"><button id="submit" class="btn" type="submit">提交答案</button><button id="reveal" class="btn secondary" type="button">直接查看答案</button><span id="result" class="quiz-note" aria-live="polite">答案将在提交后显示</span></div></form><div class="source">编写说明：'+esc(item.source||'本站编写')+' · <a href="../thanks/index.html">参考资料与特别鸣谢</a></div><nav class="pager" aria-label="本级相邻文章">'+prevHtml+nextHtml+'</nav>';
      function showResults(requireAll){var score=0,answered=0;item.questions.forEach(function(q,qi){var field=root.querySelector('[data-question="'+qi+'"]'),selected=field.querySelector('input:checked');if(selected)answered++;var picked=selected?Number(selected.value):-1;Array.prototype.forEach.call(field.querySelectorAll('.choice'),function(label,oi){label.classList.toggle('correct',oi===q.answer);label.classList.toggle('wrong',picked===oi&&oi!==q.answer)});var fb=document.getElementById('feedback'+qi);fb.classList.add('show');fb.innerHTML='<strong>正确答案：'+(q.answer+1)+'. '+esc(q.options[q.answer])+'</strong><br>'+esc(q.explanation);if(picked===q.answer)score++});if(requireAll&&answered<item.questions.length){document.getElementById('result').textContent='请先完成全部 '+item.questions.length+' 道题';return false}document.getElementById('result').className='result';document.getElementById('result').textContent=answered?('答对 '+score+' / '+item.questions.length+' 题'):'已显示答案与解析';Array.prototype.forEach.call(root.querySelectorAll('input'),function(input){input.disabled=true});document.getElementById('submit').disabled=true;document.getElementById('reveal').disabled=true;return true}
      document.getElementById('quiz').addEventListener('submit',function(e){e.preventDefault();var answered=root.querySelectorAll('input:checked').length;if(answered<item.questions.length){document.getElementById('result').textContent='请先完成全部 '+item.questions.length+' 道题';return}showResults(false)});
      document.getElementById('reveal').addEventListener('click',function(){showResults(false)});
      document.getElementById('speak').addEventListener('click',function(){if(!('speechSynthesis'in window)){this.disabled=true;this.textContent='当前浏览器不支持朗读';return}window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(item.body);u.lang='ja-JP';u.rate=.88;window.speechSynthesis.speak(u)});
    })();
  </script>
</body>
</html>
