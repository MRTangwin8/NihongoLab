<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../assets/icon.svg"><title>词汇目录｜NihongoLab</title><script src="../assets/theme.js"></script><style>
:root{color-scheme:light;--p:#3f7772;--ink:#273633;--muted:#667773;--line:#cfdbd7;--bg:#f3f7f5;--surface:#fff;--soft:#eaf3f0}:root[data-theme=dark]{color-scheme:dark;--p:#76b5ac;--ink:#e5eeeb;--muted:#a7b7b3;--line:#3a4d48;--bg:#111816;--surface:#1a2421;--soft:#23322e}@media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--p:#76b5ac;--ink:#e5eeeb;--muted:#a7b7b3;--line:#3a4d48;--bg:#111816;--surface:#1a2421;--soft:#23322e}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei","Yu Gothic UI",sans-serif;line-height:1.6}.top{background:var(--surface);border-bottom:1px solid var(--line)}.top div,main{max-width:1080px;margin:auto}.top div{padding:15px 18px;display:flex;justify-content:space-between}.top a{color:var(--p);text-decoration:none}.brand{font-weight:700}main{padding:24px 18px}.tools{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;margin-bottom:12px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--surface);color:var(--ink)}button{background:var(--p);color:#fff;cursor:pointer}.meta{color:var(--muted);font-size:13px;margin:8px 0 15px}.table{overflow:auto;border:1px solid var(--line);border-radius:7px;background:var(--surface);max-height:68vh}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left}th{position:sticky;top:0;background:var(--soft);color:var(--p)}td a{color:var(--p);font-weight:600;text-decoration:none}.pages{display:flex;gap:8px;justify-content:center;margin:16px}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:650px){.tools{grid-template-columns:1fr}.table{max-height:none}}
</style></head><body><header class="top"><div><a class="brand" href="../index.html">NihongoLab - 日语学习工具</a><a href="../tools/vocab-builder.html">添加词汇</a></div></header><main><h1>词汇目录</h1><div class="tools"><input id="q" type="search" placeholder="搜索单词、读音、中英文意思"><select id="book"></select><select id="cat"><option value="">全部分类</option></select></div><div class="meta" id="meta"></div><div class="table" id="result"></div><div class="pages"><button id="prev">上一页</button><button id="next">下一页</button></div></main>
<script src="../data/vocab.js?v=20260919-pos"></script><script src="../data/jlpt_vocab.js"></script><script src="../data/n2_vocab.js?v=20260919-examples"></script><script src="../data/n4_extra_vocab.js"></script><script>(function(){'use strict';var defs=[['eju','EJU 综合词汇',window.EJU_VOCAB||[]],['n5','JLPT N5',window.JLPT_VOCAB&&JLPT_VOCAB.n5||[]],['n4','JLPT N4',window.JLPT_VOCAB&&JLPT_VOCAB.n4||[]],['n4_extra','JLPT N4 扩展',window.N4_EXTRA_VOCAB||[]],['n3','JLPT N3',window.JLPT_VOCAB&&JLPT_VOCAB.n3||[]],['n2','JLPT N2',window.N2_VOCAB||[]],['n1','JLPT N1',window.JLPT_VOCAB&&JLPT_VOCAB.n1||[]]],$=function(x){return document.getElementById(x)},page=0,size=100;function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}$('book').innerHTML='<option value="">全部词库</option>'+defs.map(function(d){return '<option value="'+d[0]+'">'+d[1]+'</option>'}).join('');function all(){var out=[];defs.forEach(function(d){if(!$('book').value||$('book').value===d[0])d[2].forEach(function(v){out.push({v:v,id:d[0],label:d[1]})})});return out}function cats(){var seen={};all().forEach(function(x){seen[x.v.category||'未分类']=1});var keep=$('cat').value;$('cat').innerHTML='<option value="">全部分类</option>'+Object.keys(seen).sort().map(function(x){return '<option>'+esc(x)+'</option>'}).join('');$('cat').value=keep}function render(){var q=$('q').value.trim().toLowerCase(),cat=$('cat').value,list=all().filter(function(x){var v=x.v;return(!cat||(v.category||'未分类')===cat)&&(!q||[v.w,v.r,v.cn,v.en,v.pos,v.category].join(' ').toLowerCase().indexOf(q)>=0)}),max=Math.max(0,Math.ceil(list.length/size)-1);page=Math.min(page,max);var rows=list.slice(page*size,(page+1)*size);$('meta').textContent='共 '+list.length+' 词 · 第 '+(page+1)+' / '+(max+1)+' 页';$('result').innerHTML=rows.length?'<table><thead><tr><th>词库</th><th>单词</th><th>读音</th><th>词性</th><th>分类</th><th>中文意思</th><th>English</th></tr></thead><tbody>'+rows.map(function(x){var v=x.v;return '<tr><td>'+esc(x.label)+'</td><td><a href="detail.html?book='+encodeURIComponent(x.id)+'&n='+encodeURIComponent(v.n)+'">'+esc(v.w)+(v.suru?'する':'')+'</a></td><td>'+esc(v.r||'')+'</td><td>'+esc(v.posStd||v.pos||'')+'</td><td>'+esc(v.category||'未分类')+'</td><td>'+esc(v.cn||'')+'</td><td>'+esc(v.en||'')+'</td></tr>'}).join('')+'</tbody></table>':'<div class="empty">没有找到匹配的词汇。</div>';$('prev').disabled=page===0;$('next').disabled=page>=max}var p=new URLSearchParams(location.search);$('book').value=p.get('book')||'';cats();$('cat').value=p.get('category')||'';$('q').value=p.get('q')||'';$('q').oninput=function(){page=0;render()};$('book').onchange=function(){page=0;cats();render()};$('cat').onchange=function(){page=0;render()};$('prev').onclick=function(){page--;render()};$('next').onclick=function(){page++;render()};render()})();</script></body></html>
